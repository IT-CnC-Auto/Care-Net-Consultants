<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);color:var(--text-body);background:#E8E6E3}
a{color:var(--cnc-red)}a:hover{color:var(--red-dark)}
button{font-family:var(--font-heading)}
@keyframes cncspin{to{transform:rotate(360deg)}}
@keyframes cncring{0%{transform:scale(1);opacity:.85}70%{transform:scale(1.28);opacity:0}100%{transform:scale(1.28);opacity:0}}
@keyframes cncbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}36%{transform:scale(1.1)}48%{transform:scale(1)}}
@keyframes cncpulsemove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes cncdrop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes cncscan{0%,100%{top:12%}50%{top:84%}}
.cnc-scanline{animation:cncscan 2.2s ease-in-out infinite}
.cnc-scroll>*{flex:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#C9C9C9;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
